server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # RSVP pages: always proxy to backend so Open Graph meta is injected
    # into the SPA shell for messaging link previews and first paint.
    location /rsvp/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        # Use the upstream host (Cloud Run service URL), not the public
        # frontend Host — Cloud Run routes on Host and rejects mismatches.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    # Don't cache HTML files - always get the latest index.html
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # SPA routing - all routes go to index.html
    location / {
        # Don't cache the main index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (Vite already adds hashes to filenames for cache busting)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
